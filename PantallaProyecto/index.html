<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://*.tile.openstreetmap.org;<% if (ctx.dev) { %> connect-src 'self' ws://localhost:*; worker-src 'self' blob:;<% } %>"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="pestaña.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/pestaña.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/pestaña.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/pestaña.png"
    />
    <link rel="icon" type="image/png" href="icons/pestaña" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
